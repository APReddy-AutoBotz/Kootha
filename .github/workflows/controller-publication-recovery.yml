name: Controller Publication Recovery

on:
  push:
    branches:
      - milestone/m28-commercial-schedule-operations

permissions:
  contents: write

jobs:
  publish-approved-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified M28 recovery and remove scaffold
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BASE='05d34c3431be6f9bcdc2420ea8aac1c3789d7983'
          COMMENT_ID='5310178298'
          WORKFLOW='.github/workflows/controller-publication-recovery.yml'

          test "$(git rev-parse HEAD^)" = "$BASE"
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" --jq .body > /tmp/recovery-comment.txt
          sed -nE 's/^[0-9]{2}\/04=(.*)$/\1/p' /tmp/recovery-comment.txt | tr -d '\n' > /tmp/recovery.b64
          test "$(wc -c < /tmp/recovery.b64 | tr -d ' ')" = '6704'
          base64 -d /tmp/recovery.b64 > /tmp/recovery.patch.gz
          echo 'cb89e21c736e7b8ce8d54711f86694454d400f07e642275aa45cdb2e1d522f3b  /tmp/recovery.patch.gz' | sha256sum -c -
          test "$(wc -c < /tmp/recovery.patch.gz | tr -d ' ')" = '5027'
          gzip -dc /tmp/recovery.patch.gz > /tmp/recovery.patch
          echo '7450ebd1e41b99d40be6b6cf24758a104e8693b2da98ed37f49e46fcf2fb7549  /tmp/recovery.patch' | sha256sum -c -
          test "$(wc -c < /tmp/recovery.patch | tr -d ' ')" = '20441'

          git apply --check /tmp/recovery.patch
          git apply /tmp/recovery.patch
          test "$(git hash-object apps/web/src/admin.tsx)" = 'f9951f0acb8ab1cd0e67850ecdaee6f4f23a6fea'
          test "$(git hash-object supabase/migrations/20260815150729_m28_commercial_schedule_operations.sql)" = '8be3bb01f68fe59ac0612a96a39492033f068fc8'
          test "$(git hash-object supabase/tests/m28_commercial_schedule.test.sql)" = 'a0da3bec8f39373e91647017b86f92d3ca27c42a'
          test "$(git hash-object tests/m28-commercial-schedule.test.ts)" = '005b36ee6234973c7cbac27bc2172deac8170da4'
          test "$(git hash-object tests/m28-commercial-ui.test.ts)" = 'fa684fe328a91076c7ff387e5d4435d54effb040'

          git rm "$WORKFLOW"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: converge M28 schedule mutation authority'
          git push origin HEAD:milestone/m28-commercial-schedule-operations
