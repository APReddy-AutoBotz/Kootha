name: Quality and security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  controller-derived-end-date:
    if: github.event_name == 'pull_request' && github.head_ref == 'milestone/m28-commercial-schedule-operations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone/m28-commercial-schedule-operations
          fetch-depth: 0
      - run: git fetch origin main
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact legacy End-date closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/admin.tsx')
          text = path.read_text()

          old_helper = '''function updateScheduleDate(field: "startDate" | "endDate", value: string) {
    setAdWorkDraft((current) => {
      if (!current) {
        return current;
      }

      if (field === "startDate") {
        return {
          ...current,
          startDate: value,
          endDate: getPlannedEndDate(value, current.numberOfDays)
        };
      }

      return {
        ...current,
        endDate: value
      };
    });
  }'''
          new_helper = '''function updateScheduleStartDate(value: string) {
    setAdWorkDraft((current) => current && {
      ...current,
      startDate: value,
      endDate: getPlannedEndDate(value, current.numberOfDays)
    });
  }'''
          if text.count(old_helper) != 1:
              raise SystemExit(f'expected one updateScheduleDate helper, found {text.count(old_helper)}')
          text = text.replace(old_helper, new_helper, 1)

          old_start = 'onChange={(event) => updateScheduleDate("startDate", event.target.value)}'
          new_start = 'onChange={(event) => updateScheduleStartDate(event.target.value)}'
          if text.count(old_start) != 1:
              raise SystemExit(f'expected one legacy Start-date handler, found {text.count(old_start)}')
          text = text.replace(old_start, new_start, 1)

          old_end = '''<label>
                        End date
                        <input
                          type="date"
                          value={adWorkDraft.endDate}
                          onChange={(event) => updateScheduleDate("endDate", event.target.value)}
                        />
                      </label>'''
          new_end = '''<label>
                        End date (derived)
                        <input
                          type="date"
                          value={adWorkDraft.endDate}
                          readOnly
                          aria-readonly="true"
                        />
                        <small>Derived from Start date and Number of days.</small>
                      </label>'''
          if text.count(old_end) != 1:
              raise SystemExit(f'expected one editable legacy End-date block, found {text.count(old_end)}')
          text = text.replace(old_end, new_end, 1)

          path.write_text(text)
          PY
          git diff --check -- apps/web/src/admin.tsx
      - run: pnpm vitest run tests/m28-final-consistency-closure.test.ts
      - run: pnpm typecheck
      - name: Publish product fix and restore canonical workflow
        shell: bash
        run: |
          git config user.name "Kootha Implementation Controller"
          git config user.email "actions@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/quality.yml
          git diff --check
          git add apps/web/src/admin.tsx .github/workflows/quality.yml
          git commit -m "fix(m28): make legacy end date derived"
          git push origin HEAD:milestone/m28-commercial-schedule-operations

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm security:scan
      - run: pnpm migrations:check
      - run: git diff --check

  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - run: supabase test db
