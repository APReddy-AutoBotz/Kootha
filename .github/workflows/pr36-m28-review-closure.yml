name: PR36 M28 publication recovery

on:
  push:
    branches:
      - milestone/m28-commercial-schedule-operations

permissions:
  contents: write

jobs:
  publish-approved-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and publish approved M28 correction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%s)"
          if [ "$message" != "controller: execute M28 recovery" ]; then
            echo "No controller recovery requested for this commit."
            exit 0
          fi
          python - <<'PY'
          import base64, gzip, hashlib, json, os, re, subprocess, urllib.request
          url = 'https://api.github.com/repos/APReddy-AutoBotz/Kootha/issues/comments/5304470946'
          req = urllib.request.Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(req) as response:
              body = json.load(response)['body']
          chunks = []
          for n in (1, 2, 3):
              marker = rf"#### Chunk {n}/3\s*\n\s*```text\s*\n([A-Za-z0-9+/=\r\n]+?)\n```"
              found = re.search(marker, body)
              if not found:
                  raise SystemExit(f'missing chunk {n}/3')
              chunks.append(re.sub(r'\s+', '', found.group(1)))
          compressed = base64.b64decode(''.join(chunks), validate=True)
          if len(compressed) != 9898:
              raise SystemExit(f'unexpected gzip length {len(compressed)}')
          print('transport gzip sha256', hashlib.sha256(compressed).hexdigest())
          patch = gzip.decompress(compressed)
          if len(patch) != 59175:
              raise SystemExit(f'unexpected patch length {len(patch)}')
          patch_sha = hashlib.sha256(patch).hexdigest()
          print('uncompressed patch sha256', patch_sha)
          if patch_sha != '6b94c1f8342ef74dbae964a0b613146b17880e4a2281745f0d12e8d3b219855b':
              raise SystemExit('uncompressed patch sha256 mismatch')
          open('/tmp/m28.diff', 'wb').write(patch)
          excluded = '.github/workflows/pr36-m28-review-closure.yml'
          subprocess.run(['git','apply','--check',f'--exclude={excluded}','/tmp/m28.diff'], check=True)
          subprocess.run(['git','apply','--index',f'--exclude={excluded}','/tmp/m28.diff'], check=True)
          changed = sorted(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          expected = sorted([
              'apps/web/src/admin.tsx',
              'supabase/migrations/20260815150729_m28_commercial_schedule_operations.sql',
              'supabase/tests/m28_commercial_schedule.test.sql',
              'tests/m28-commercial-schedule.test.ts',
              'tests/m28-commercial-ui.test.ts',
          ])
          if changed != expected:
              raise SystemExit(f'unexpected staged paths: {changed!r}')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close M28 schedule authority review findings'
          git push origin HEAD:milestone/m28-commercial-schedule-operations
