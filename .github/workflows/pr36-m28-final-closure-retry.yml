name: PR36 M28 final closure retry

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  close-review-family:
    if: github.event.pull_request.number == 36 && github.event.pull_request.head.ref == 'milestone/m28-commercial-schedule-operations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone/m28-commercial-schedule-operations
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Rebuild bounded closure and correct pgTAP plan
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet c577cfb1d5a8cefde989def7b41299a5ce207794 HEAD -- . \
            ':(exclude).github/workflows/pr36-m28-final-closure.yml' \
            ':(exclude).github/workflows/pr36-m28-final-closure-observable.yml' \
            ':(exclude).github/workflows/pr36-m28-final-closure-retry.yml'
          python <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/pr36-m28-final-closure.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = src.index(start_marker) + len(start_marker)
          end = src.index(end_marker, start)
          lines = src[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/m28_closure.py').write_text(script)
          PY
          python /tmp/m28_closure.py
          test "$(grep -c '^select plan(12);$' supabase/tests/m28_execution_lock_schedule_history_closure.test.sql)" = "1"
          sed -i 's/^select plan(12);$/select plan(13);/' supabase/tests/m28_execution_lock_schedule_history_closure.test.sql
          rm -f .github/workflows/pr36-m28-final-closure.yml
          rm -f .github/workflows/pr36-m28-final-closure-observable.yml
          rm -f .github/workflows/pr36-m28-final-closure-retry.yml
          git diff --check
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate application and retained gates
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm security:scan
          pnpm migrations:check
          git diff --check
      - name: Validate fresh Supabase and full pgTAP/RLS
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
          supabase test db
      - name: Publish corrected product head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Avala Parameswara Reddy"
          git config user.email "avalaparameswarareddy@gmail.com"
          git add -A
          git commit -m "fix: close M28 execution lock and schedule history review family"
          git push origin HEAD:milestone/m28-commercial-schedule-operations
