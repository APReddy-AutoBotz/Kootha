name: M27 filter identity closure

on:
  push:
    branches:
      - milestone/m27-governed-operations-export-audit

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact controller head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact product parent
        shell: bash
        run: |
          set -euo pipefail
          expected="307d5a91b65d510af15decf1ee9fbf367e7ceca3"
          actual="$(git rev-parse HEAD^)"
          test "$actual" = "$expected" || {
            echo "Expected controller parent $expected but found $actual"
            exit 1
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply bounded closure
        shell: bash
        run: |
          set -euo pipefail
          python scripts/m27-filter-identity-closure.py
          rm scripts/m27-filter-identity-closure.py
          git diff --check

      - name: Run focused M27 tests
        run: pnpm test -- --run tests/m27-operations-export.test.ts tests/m27-operations-ui.test.ts

      - name: Run full Vitest
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Migration guardrails
        run: pnpm migrations:check

      - name: Security guardrails
        run: pnpm security:scan

      - name: Production build
        run: pnpm build

      - name: Start fresh Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor

      - name: Run full pgTAP and RLS suite
        run: supabase test db

      - name: Final diff proof
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e scripts/m27-filter-identity-closure.py
          grep -q 'resultKey === exportFilterKey' apps/web/src/admin-operations.tsx
          grep -q 'candidate.containsPii !== operationsExportScopeContainsPii' packages/shared/src/operationsExport.ts

      - name: Publish verified closure
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m27-filter-identity-closure.yml
          git config user.name "APReddy-AutoBotz"
          git config user.email "avalaparameswarareddy@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: bind M27 results to current filters"
          git push origin HEAD:milestone/m27-governed-operations-export-audit
