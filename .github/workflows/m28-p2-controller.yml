name: M28 P2 controller closure

on:
  push:
    branches:
      - milestone/m28-commercial-schedule-operations
    paths:
      - .github/workflows/m28-p2-controller.yml

permissions:
  contents: write

jobs:
  apply-closure:
    if: github.event.head_commit.message != 'fix(m28): preserve mutation inputs on failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone/m28-commercial-schedule-operations
          fetch-depth: 0
      - name: Apply exact P2 closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/admin-commercial.tsx')
          text = path.read_text()

          replacements = [
              (
                  '  async function runMutation(rpc: string, body: Record<string, unknown>) {\n    if (!snapshot) return;',
                  '  async function runMutation(rpc: string, body: Record<string, unknown>): Promise<boolean> {\n    if (!snapshot) return false;'
              ),
              (
                  '      if (requestId !== requestSequence.current\n        || adWorkId !== selectedAdWorkRef.current\n        || expectedFingerprint !== snapshotFingerprint) return;\n      if (!applySnapshot(envelope.snapshot, requestId, adWorkId)) return;\n      if (typeof envelope.customerMessage === "string") setCustomerMessage(envelope.customerMessage);',
                  '      if (requestId !== requestSequence.current\n        || adWorkId !== selectedAdWorkRef.current\n        || expectedFingerprint !== snapshotFingerprint) return false;\n      if (!applySnapshot(envelope.snapshot, requestId, adWorkId)) return false;\n      if (typeof envelope.customerMessage === "string") setCustomerMessage(envelope.customerMessage);\n      return true;'
              ),
              (
                  '      if (requestId === requestSequence.current && adWorkId === selectedAdWorkRef.current) {\n        setError(mutationError instanceof Error ? mutationError.message : "The change could not be saved.");\n      }\n    } finally {',
                  '      if (requestId === requestSequence.current && adWorkId === selectedAdWorkRef.current) {\n        setError(mutationError instanceof Error ? mutationError.message : "The change could not be saved.");\n      }\n      return false;\n    } finally {'
              ),
              ('    await runMutation("admin_reschedule_ad_work_v1", {', '    const saved = await runMutation("admin_reschedule_ad_work_v1", {'),
              ('    setRescheduleReason("");\n  }\n\n  async function rescheduleDay()', '    if (saved) setRescheduleReason("");\n  }\n\n  async function rescheduleDay()'),
              ('    await runMutation("admin_reschedule_ad_work_day_v1", {', '    const saved = await runMutation("admin_reschedule_ad_work_day_v1", {'),
              ('    setDayReason("");\n    setNewDayDate("");\n  }\n\n  async function cancelWork()', '    if (saved) {\n      setDayReason("");\n      setNewDayDate("");\n    }\n  }\n\n  async function cancelWork()'),
              ('    await runMutation("admin_cancel_ad_work_v1", {', '    const saved = await runMutation("admin_cancel_ad_work_v1", {'),
              ('    setCancellationReason("");\n    setCancellationInternalNote("");\n  }\n\n  async function copyCustomerMessage()', '    if (saved) {\n      setCancellationReason("");\n      setCancellationInternalNote("");\n    }\n  }\n\n  async function copyCustomerMessage()'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one source match, found {text.count(old)} for: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          test_path = Path('tests/m28-replay-current-snapshot-closure.test.ts')
          test = test_path.read_text()
          marker = '\n});\n'
          if not test.endswith(marker):
              raise SystemExit('unexpected replay closure test ending')
          addition = r'''

  it("preserves mutation inputs until a validated authoritative response succeeds", () => {
    expect(workbenchSource).toContain("async function runMutation(rpc: string, body: Record<string, unknown>): Promise<boolean>");
    expect(workbenchSource).toContain("if (!snapshot) return false;");
    expect(workbenchSource).toContain("expectedFingerprint !== snapshotFingerprint) return false;");
    expect(workbenchSource).toContain("if (!applySnapshot(envelope.snapshot, requestId, adWorkId)) return false;");
    expect(workbenchSource).toContain("return true;");
    expect(workbenchSource).toContain('const saved = await runMutation("admin_reschedule_ad_work_v1"');
    expect(workbenchSource).toContain('if (saved) setRescheduleReason("");');
    expect(workbenchSource).toContain('const saved = await runMutation("admin_reschedule_ad_work_day_v1"');
    expect(workbenchSource).toContain('if (saved) {\n      setDayReason("");\n      setNewDayDate("");');
    expect(workbenchSource).toContain('const saved = await runMutation("admin_cancel_ad_work_v1"');
    expect(workbenchSource).toContain('if (saved) {\n      setCancellationReason("");\n      setCancellationInternalNote("");');
  });'''
          test_path.write_text(test[:-len(marker)] + addition + marker)
          PY

          git diff --check
          git diff -- apps/web/src/admin-commercial.tsx tests/m28-replay-current-snapshot-closure.test.ts
      - name: Publish closure and self-remove controller
        shell: bash
        run: |
          git config user.name "Kootha Implementation Controller"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/admin-commercial.tsx tests/m28-replay-current-snapshot-closure.test.ts
          git rm .github/workflows/m28-p2-controller.yml
          git commit -m "fix(m28): preserve mutation inputs on failure"
          git push origin HEAD:milestone/m28-commercial-schedule-operations
