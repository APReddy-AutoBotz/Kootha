name: PR32 evidence repository lock closure retry

on:
  push:
    branches:
      - codex/github-mention-m24/m26-pre-device-integration-readiness-c
    paths:
      - .github/workflows/pr32-evidence-repository-lock-closure-retry.yml

permissions:
  contents: write

jobs:
  close-review-finding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/github-mention-m24/m26-pre-device-integration-readiness-c
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact base
        shell: bash
        run: test "$(git rev-parse HEAD^)" = "8e9ac139a40d8247caae6b3ac45a27062d08fa79"

      - name: Reapply proposal with portable repository-read proof
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/pr32-evidence-repository-lock-closure.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply evidence repository serialization closure\n'
          start = workflow.index(marker)
          run_marker = '        run: |\n'
          run_start = workflow.index(run_marker, start) + len(run_marker)
          end = workflow.index('\n      - name: Enable Corepack', run_start)
          block = workflow[run_start:end]
          lines = block.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-evidence-closure.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-evidence-closure.sh
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/tests/m26_evidence_repository_lock_closure.test.sql')
          text = path.read_text(encoding='utf-8')
          old = "position('physical_pilot_repository_authority' in pg_get_functiondef"
          new = "position('from public.physical_pilot_repository_authority' in pg_get_functiondef"
          assert text.count(old) == 1, 'expected exactly one broad repository token assertion'
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Focused tests
        run: corepack pnpm test -- --run tests/m26-evidence-repository-lock-closure.test.ts tests/m26-network-lock-order-closure.test.ts tests/m26-cert-network-time-closure.test.ts tests/m26-pre-device-readiness.test.ts
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Lint
        run: corepack pnpm lint
      - name: Full Vitest
        run: corepack pnpm test
      - name: Migration guardrails
        run: corepack pnpm migrations:check
      - name: Security guardrails
        run: corepack pnpm security:scan
      - name: Production build
        run: corepack pnpm build

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - name: Full pgTAP/RLS
        run: supabase test db
      - name: Diff check
        run: git diff --check

      - name: Publish closure and remove temporary workflows
        shell: bash
        run: |
          git config user.name "Kootha Controller"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pr32-evidence-repository-lock-closure.yml \
            .github/workflows/pr32-evidence-repository-lock-closure-retry.yml
          git add supabase/migrations/20260814080000_m26_evidence_repository_lock_closure.sql \
            supabase/tests/m26_evidence_repository_lock_closure.test.sql \
            tests/m26-evidence-repository-lock-closure.test.ts
          git diff --cached --check
          git commit -m "Serialize M26 evidence with repository authority"
          git push origin HEAD:codex/github-mention-m24/m26-pre-device-integration-readiness-c
