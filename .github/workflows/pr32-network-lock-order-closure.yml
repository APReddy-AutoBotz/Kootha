name: PR32 network lock-order closure

on:
  push:
    branches:
      - codex/github-mention-m24/m26-pre-device-integration-readiness-c
    paths:
      - .github/workflows/pr32-network-lock-order-closure.yml

permissions:
  contents: write

jobs:
  close-review-finding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/github-mention-m24/m26-pre-device-integration-readiness-c
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact base
        shell: bash
        run: test "$(git rev-parse HEAD^)" = "5f853fdba9f2956df9cd805f947e58a9659bbc3f"

      - name: Apply network lock-order closure
        shell: bash
        run: |
          cat > supabase/migrations/20260814070000_m26_network_validation_lock_order_closure.sql <<'SQL'
          -- M26 network-validation lock-order closure.
          -- Exact receipt replay remains first and independent of mutable authority.
          -- New receipts acquire device -> repository before any commissioning row lock.

          create or replace function public.service_record_physical_pilot_network_validation_v1(
            p_receipt_id uuid,
            p_commissioning_id uuid,
            p_expected_version bigint,
            p_device_id uuid,
            p_vehicle_link_id uuid,
            p_installation_event_id uuid,
            p_credential_id uuid,
            p_network_configuration_class text,
            p_configuration_identity_hash text,
            p_validated_at timestamptz,
            p_repository_head_sha text,
            p_workflow_run_id text
          ) returns uuid
          language plpgsql
          security definer
          set search_path=pg_catalog,public
          as $$
          declare
            c public.physical_pilot_commissioning%rowtype;
            l public.gps_device_vehicle_links%rowtype;
            i public.gps_device_lifecycle_events%rowtype;
            k public.gps_device_credential_metadata%rowtype;
            r public.physical_pilot_repository_authority%rowtype;
            n public.physical_pilot_network_validation_receipts%rowtype;
          begin
            if coalesce(auth.role(),'')<>'service_role' then
              raise exception 'Service authority required' using errcode='42501';
            end if;
            if p_network_configuration_class is null
              or char_length(p_network_configuration_class) not between 1 and 80
              or not public.m24f_is_safe_metadata(p_network_configuration_class)
            then
              raise exception 'Unsafe network configuration class' using errcode='22023';
            end if;

            -- Serialize identical in-flight requests and resolve exact replay before
            -- consulting any mutable commissioning/certification/repository authority.
            perform pg_advisory_xact_lock(hashtext(p_receipt_id::text));
            select * into n
            from public.physical_pilot_network_validation_receipts
            where id=p_receipt_id;
            if n.id is not null then
              if n.commissioning_id is distinct from p_commissioning_id
                or n.commissioning_version is distinct from p_expected_version
                or n.gps_device_id is distinct from p_device_id
                or n.vehicle_link_id is distinct from p_vehicle_link_id
                or n.installation_event_id is distinct from p_installation_event_id
                or n.credential_id is distinct from p_credential_id
                or n.network_configuration_class is distinct from p_network_configuration_class
                or n.configuration_identity_hash is distinct from p_configuration_identity_hash
                or n.validated_at is distinct from p_validated_at
                or n.repository_head_sha is distinct from p_repository_head_sha
                or n.workflow_run_id is distinct from p_workflow_run_id
              then
                raise exception 'Network validation receipt replay conflict' using errcode='22023';
              end if;
              return n.id;
            end if;

            -- New receipt authority uses the canonical ordering shared by readiness:
            -- device first, repository/certification second, row locks only afterwards.
            perform public.m26_lock_device_authority_v1(p_device_id);
            perform pg_advisory_xact_lock(hashtext('m26_repository_authority'));

            select * into c
            from public.physical_pilot_commissioning
            where id=p_commissioning_id
            for update;
            select * into l
            from public.gps_device_vehicle_links
            where id=p_vehicle_link_id
            for share;
            select * into i
            from public.gps_device_lifecycle_events
            where id=p_installation_event_id
            for share;
            select * into k
            from public.gps_device_credential_metadata
            where id=p_credential_id
            for share;
            select * into r
            from public.physical_pilot_repository_authority
            order by generation desc
            limit 1
            for share;

            if c.id is null
              or c.state<>'commissioning'
              or c.version is distinct from p_expected_version
              or c.gps_device_id<>p_device_id
              or c.network_configuration_class is distinct from p_network_configuration_class
              or l.gps_device_id is distinct from p_device_id
              or l.effective_until is not null
              or not l.is_primary
              or i.gps_device_id is distinct from p_device_id
              or i.vehicle_id is distinct from l.vehicle_id
              or i.event_type<>'installed'
              or i.effective_at<l.effective_from
              or exists(
                select 1
                from public.gps_device_lifecycle_events x
                where x.gps_device_id=p_device_id
                  and x.event_type in ('installed','removed','replaced','lost','stolen','retired','setup_reopened')
                  and (x.effective_at,x.created_at)>(i.effective_at,i.created_at)
              )
              or k.gps_device_id is distinct from p_device_id
              or k.status<>'active'
              or k.last_verified_at is null
              or k.last_verified_at<i.effective_at
              or (k.expires_at is not null and k.expires_at<=p_validated_at)
              or r.generation is null
              or r.repository_head_sha is distinct from p_repository_head_sha
              or r.workflow_run_id is distinct from p_workflow_run_id
              or c.selected_certification_run_id is distinct from public.m26_current_certification_run_v1(c.selected_candidate_id,c.selected_manifest_id)
              or p_configuration_identity_hash !~ '^[a-f0-9]{64}$'
              or p_validated_at>clock_timestamp()
              or p_validated_at<greatest(i.effective_at,k.last_verified_at)
            then
              raise exception 'Network validation is not bound to current authority' using errcode='42501';
            end if;

            insert into public.physical_pilot_network_validation_receipts(
              id,commissioning_id,commissioning_version,gps_device_id,vehicle_link_id,
              installation_event_id,credential_id,certification_run_id,
              repository_authority_generation,repository_head_sha,workflow_run_id,
              network_configuration_class,configuration_identity_hash,validated_at
            ) values(
              p_receipt_id,c.id,c.version,p_device_id,l.id,i.id,k.id,
              c.selected_certification_run_id,r.generation,r.repository_head_sha,
              r.workflow_run_id,p_network_configuration_class,
              p_configuration_identity_hash,p_validated_at
            );
            return p_receipt_id;
          end;
          $$;

          revoke all on function public.service_record_physical_pilot_network_validation_v1(
            uuid,uuid,bigint,uuid,uuid,uuid,uuid,text,text,timestamptz,text,text
          ) from public,anon,authenticated;
          grant execute on function public.service_record_physical_pilot_network_validation_v1(
            uuid,uuid,bigint,uuid,uuid,uuid,uuid,text,text,timestamptz,text,text
          ) to service_role;
          SQL

          cat > supabase/tests/m26_network_validation_lock_order_closure.test.sql <<'SQL'
          begin;
          select plan(7);

          select has_function(
            'public','service_record_physical_pilot_network_validation_v1',
            array['uuid','uuid','bigint','uuid','uuid','uuid','uuid','text','text','timestamp with time zone','text','text'],
            'network validation RPC remains available'
          );

          select ok(
            position('select * into n' in pg_get_functiondef('public.service_record_physical_pilot_network_validation_v1(uuid,uuid,bigint,uuid,uuid,uuid,uuid,text,text,timestamptz,text,text)'::regprocedure))
              < position('m26_lock_device_authority_v1(p_device_id)' in pg_get_functiondef('public.service_record_physical_pilot_network_validation_v1(uuid,uuid,bigint,uuid,uuid,uuid,uuid,text,text,timestamptz,text,text)'::regprocedure)),
            'receipt replay lookup precedes mutable device authority lock'
          );
          select ok(
            position('m26_lock_device_authority_v1(p_device_id)' in pg_get_functiondef('public.service_record_physical_pilot_network_validation_v1(uuid,uuid,bigint,uuid,uuid,uuid,uuid,text,text,timestamptz,text,text)'::regprocedure))
              < position('pg_advisory_xact_lock(hashtext(''m26_repository_authority''))' in pg_get_functiondef('public.service_record_physical_pilot_network_validation_v1(uuid,uuid,bigint,uuid,uuid,uuid,uuid,text,text,timestamptz,text,text)'::regprocedure)),
            'new network validation locks device before repository authority'
          );
          select ok(
            position('pg_advisory_xact_lock(hashtext(''m26_repository_authority''))' in pg_get_functiondef('public.service_record_physical_pilot_network_validation_v1(uuid,uuid,bigint,uuid,uuid,uuid,uuid,text,text,timestamptz,text,text)'::regprocedure))
              < position('where id=p_commissioning_id' in pg_get_functiondef('public.service_record_physical_pilot_network_validation_v1(uuid,uuid,bigint,uuid,uuid,uuid,uuid,text,text,timestamptz,text,text)'::regprocedure)),
            'repository authority lock precedes commissioning row lock'
          );
          select ok(
            position('Network validation receipt replay conflict' in pg_get_functiondef('public.service_record_physical_pilot_network_validation_v1(uuid,uuid,bigint,uuid,uuid,uuid,uuid,text,text,timestamptz,text,text)'::regprocedure)) > 0,
            'exact conflicting receipt replay remains rejected'
          );
          select ok(
            has_function_privilege('service_role','public.service_record_physical_pilot_network_validation_v1(uuid,uuid,bigint,uuid,uuid,uuid,uuid,text,text,timestamptz,text,text)','EXECUTE'),
            'service role retains sanctioned RPC execution'
          );
          select ok(
            not has_function_privilege('authenticated','public.service_record_physical_pilot_network_validation_v1(uuid,uuid,bigint,uuid,uuid,uuid,uuid,text,text,timestamptz,text,text)','EXECUTE'),
            'authenticated role remains excluded from service RPC'
          );

          select * from finish();
          rollback;
          SQL

          cat > tests/m26-network-lock-order-closure.test.ts <<'TS'
          import { describe, expect, it } from "vitest";
          import { readFileSync } from "node:fs";

          describe("M26 network validation lock-order closure", () => {
            const migration = readFileSync(
              "supabase/migrations/20260814070000_m26_network_validation_lock_order_closure.sql",
              "utf8",
            );

            it("preserves receipt-first replay before mutable authority locks", () => {
              const replay = migration.indexOf("select * into n");
              const device = migration.indexOf("m26_lock_device_authority_v1(p_device_id)");
              expect(replay).toBeGreaterThan(-1);
              expect(device).toBeGreaterThan(replay);
              expect(migration.indexOf("return n.id", replay)).toBeLessThan(device);
            });

            it("uses device then repository before commissioning row lock", () => {
              const device = migration.indexOf("m26_lock_device_authority_v1(p_device_id)");
              const repository = migration.indexOf("pg_advisory_xact_lock(hashtext('m26_repository_authority'))", device);
              const commissioningRow = migration.indexOf("where id=p_commissioning_id", repository);
              const rowLock = migration.indexOf("for update", commissioningRow);
              expect(device).toBeGreaterThan(-1);
              expect(repository).toBeGreaterThan(device);
              expect(commissioningRow).toBeGreaterThan(repository);
              expect(rowLock).toBeGreaterThan(commissioningRow);
            });

            it("retains service-only execution and current-authority checks", () => {
              expect(migration).toContain("Service authority required");
              expect(migration).toContain("m26_current_certification_run_v1");
              expect(migration).toContain("Network validation is not bound to current authority");
              expect(migration).toContain("grant execute on function public.service_record_physical_pilot_network_validation_v1");
            });
          });
          TS

      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Focused tests
        run: corepack pnpm test -- --run tests/m26-network-lock-order-closure.test.ts tests/m26-cert-network-time-closure.test.ts tests/m26-pre-device-readiness.test.ts tests/m26-lifecycle-uuid-closure.test.ts
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Lint
        run: corepack pnpm lint
      - name: Full Vitest
        run: corepack pnpm test
      - name: Migration guardrails
        run: corepack pnpm migrations:check
      - name: Security guardrails
        run: corepack pnpm security:scan
      - name: Production build
        run: corepack pnpm build

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - name: Full pgTAP/RLS
        run: supabase test db
      - name: Diff check
        run: git diff --check

      - name: Publish closure and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Kootha Controller"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pr32-network-lock-order-closure.yml
          git add supabase/migrations/20260814070000_m26_network_validation_lock_order_closure.sql \
            supabase/tests/m26_network_validation_lock_order_closure.test.sql \
            tests/m26-network-lock-order-closure.test.ts
          git diff --cached --check
          git commit -m "Fix M26 network validation lock order"
          git push origin HEAD:codex/github-mention-m24/m26-pre-device-integration-readiness-c
