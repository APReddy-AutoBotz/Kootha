name: PR32 certification network time closure retry

on:
  push:
    branches:
      - codex/github-mention-m24/m26-pre-device-integration-readiness-c
    paths:
      - .github/workflows/pr32-cert-network-time-closure-retry.yml

permissions:
  contents: write

jobs:
  close-review-findings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/github-mention-m24/m26-pre-device-integration-readiness-c
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact base
        shell: bash
        run: test "$(git rev-parse HEAD^)" = "fb8b8faf0b40c3fc8d0f1deff16496b089702fcf"

      - name: Reuse validated closure generator and repair pgTAP portability
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/pr32-cert-network-time-closure.yml').read_text(encoding='utf-8')
          step = '      - name: Apply certification network and timestamp closure\n'
          start = source.index(step)
          run_marker = '        run: |\n'
          start = source.index(run_marker, start) + len(run_marker)
          end = source.index('\n      - name: Enable Corepack', start)
          script = dedent(source[start:end])
          Path('/tmp/pr32-apply.sh').write_text('set -euo pipefail\n' + script + '\n', encoding='utf-8')
          PY
          bash /tmp/pr32-apply.sh

          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/m26_certification_network_authority_closure.test.sql')
          text = path.read_text(encoding='utf-8')
          replacements = {
          "select like(pg_get_functiondef('public.m26_try_repository_authority_lock_v1()'::regprocedure),'%pg_try_advisory_xact_lock(hashtext(''m26_repository_authority''))%','certification writers use the readiness repository lock key');": "select ok(position('pg_try_advisory_xact_lock(hashtext(''m26_repository_authority''))' in pg_get_functiondef('public.m26_try_repository_authority_lock_v1()'::regprocedure)) > 0,'certification writers use the readiness repository lock key');",
          "select like(pg_get_functiondef('public.m26_revalidate_network_receipt_authority_v1()'::regprocedure),'%m26_lock_device_authority_v1(new.gps_device_id)%','network validation locks device first');": "select ok(position('m26_lock_device_authority_v1(new.gps_device_id)' in pg_get_functiondef('public.m26_revalidate_network_receipt_authority_v1()'::regprocedure)) > 0,'network validation locks device first');",
          "select like(pg_get_functiondef('public.m26_revalidate_network_receipt_authority_v1()'::regprocedure),'%pg_advisory_xact_lock(hashtext(''m26_repository_authority''))%','network validation locks repository second');": "select ok(position('pg_advisory_xact_lock(hashtext(''m26_repository_authority''))' in pg_get_functiondef('public.m26_revalidate_network_receipt_authority_v1()'::regprocedure)) > 0,'network validation locks repository second');",
          "select like(pg_get_functiondef('public.m26_revalidate_network_receipt_authority_v1()'::regprocedure),'%m26_current_certification_run_v1(%','network validation rechecks certification under locks');": "select ok(position('m26_current_certification_run_v1(' in pg_get_functiondef('public.m26_revalidate_network_receipt_authority_v1()'::regprocedure)) > 0,'network validation rechecks certification under locks');",
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Focused tests
        run: corepack pnpm test -- --run tests/m26-cert-network-time-closure.test.ts tests/m26-pre-device-readiness.test.ts tests/m26-future-observation-boundary.test.ts tests/m26-lifecycle-uuid-closure.test.ts
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Lint
        run: corepack pnpm lint
      - name: Full Vitest
        run: corepack pnpm test
      - name: Migration guardrails
        run: corepack pnpm migrations:check
      - name: Security guardrails
        run: corepack pnpm security:scan
      - name: Production build
        run: corepack pnpm build

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - name: Full pgTAP/RLS
        run: supabase test db
      - name: Diff check
        run: git diff --check

      - name: Publish closure and remove temporary workflows
        shell: bash
        run: |
          git config user.name "Kootha Controller"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pr32-cert-network-time-closure.yml .github/workflows/pr32-cert-network-time-closure-retry.yml
          git add packages/shared/src/physicalTelemetry/m26Readiness.ts \
            tests/m26-cert-network-time-closure.test.ts \
            supabase/migrations/20260814060000_m26_certification_network_authority_closure.sql \
            supabase/tests/m26_certification_network_authority_closure.test.sql
          git diff --cached --check
          git commit -m "Serialize M26 certification and network authority"
          git push origin HEAD:codex/github-mention-m24/m26-pre-device-integration-readiness-c
