name: PR32 evidence repository lock closure

on:
  push:
    branches:
      - codex/github-mention-m24/m26-pre-device-integration-readiness-c
    paths:
      - .github/workflows/pr32-evidence-repository-lock-closure.yml

permissions:
  contents: write

jobs:
  close-review-finding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/github-mention-m24/m26-pre-device-integration-readiness-c
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact base
        shell: bash
        run: test "$(git rev-parse HEAD^)" = "a5e022af78d11e73bb56f56218fb75beb1d9c749"

      - name: Apply evidence repository serialization closure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('supabase/migrations/20260814010000_m26_authority_review_closure.sql')
          source = source_path.read_text(encoding='utf-8')
          signature = 'create or replace function public.service_record_physical_pilot_evidence_v1('
          start = source.index(signature)
          end = source.index('\nend $$;', start) + len('\nend $$;')
          function = source[start:end]

          old_reads = ''' perform public.m26_lock_device_authority_v1(p_device_id);\n perform pg_advisory_xact_lock(hashtext(p_receipt_id::text));\n select * into c from public.physical_pilot_commissioning where id=p_commissioning_id for update;\n select * into m from public.m24f_adapter_capability_manifests where id=p_manifest_id for share;\n select * into n from public.physical_pilot_network_validation_receipts where id=p_network_validation_receipt_id for share;\n select * into l from public.gps_device_vehicle_links where id=p_vehicle_link_id for share;\n select * into i from public.gps_device_lifecycle_events where id=p_installation_receipt_id for share;\n select * into k from public.gps_device_credential_metadata where id=p_credential_id for share;\n select * into r from public.physical_pilot_repository_authority order by generation desc limit 1 for share;\n select * into e from public.physical_pilot_evidence_receipts where id=p_receipt_id;\n'''
          replay_prelude = ''' perform pg_advisory_xact_lock(hashtext(p_receipt_id::text));\n select * into e from public.physical_pilot_evidence_receipts where id=p_receipt_id;\n'''
          assert function.count(old_reads) == 1, 'current evidence authority read block changed'
          function = function.replace(old_reads, replay_prelude, 1)

          replay_end = '''  return e.id;\n end if;\n'''
          new_authority = replay_end + '''\n -- New evidence freezes mutable authority only after exact replay has been\n -- resolved. Canonical order is device -> repository/certification before\n -- commissioning/manifest/network/lifecycle/credential/repository row reads.\n perform public.m26_lock_device_authority_v1(p_device_id);\n perform pg_advisory_xact_lock(hashtext('m26_repository_authority'));\n select * into c from public.physical_pilot_commissioning where id=p_commissioning_id for update;\n select * into m from public.m24f_adapter_capability_manifests where id=p_manifest_id for share;\n select * into n from public.physical_pilot_network_validation_receipts where id=p_network_validation_receipt_id for share;\n select * into l from public.gps_device_vehicle_links where id=p_vehicle_link_id for share;\n select * into i from public.gps_device_lifecycle_events where id=p_installation_receipt_id for share;\n select * into k from public.gps_device_credential_metadata where id=p_credential_id for share;\n select * into r from public.physical_pilot_repository_authority order by generation desc limit 1 for share;\n'''
          assert function.count(replay_end) == 1, 'current exact replay block changed'
          function = function.replace(replay_end, new_authority, 1)

          migration = '''-- M26 evidence repository/certification serialization closure.\n-- Exact response-loss replay remains receipt-first. New evidence then follows\n-- receipt identity -> device -> repository/certification -> row authority -> insert.\n\n''' + function + '''\n\nrevoke all on function public.service_record_physical_pilot_evidence_v1(\n uuid,uuid,bigint,uuid,uuid,text,text,uuid,text,uuid,uuid,uuid,uuid,text,timestamptz,timestamptz,bigint,boolean,boolean,text,text,boolean,boolean,text,text[],text\n) from public,anon,authenticated;\ngrant execute on function public.service_record_physical_pilot_evidence_v1(\n uuid,uuid,bigint,uuid,uuid,text,text,uuid,text,uuid,uuid,uuid,uuid,text,timestamptz,timestamptz,bigint,boolean,boolean,text,text,boolean,boolean,text,text[],text\n) to service_role;\n'''
          Path('supabase/migrations/20260814080000_m26_evidence_repository_lock_closure.sql').write_text(migration, encoding='utf-8')
          PY

          cat > supabase/tests/m26_evidence_repository_lock_closure.test.sql <<'SQL'
          begin;
          select plan(7);

          select has_function(
            'public','service_record_physical_pilot_evidence_v1',
            array['uuid','uuid','bigint','uuid','uuid','text','text','uuid','text','uuid','uuid','uuid','uuid','text','timestamp with time zone','timestamp with time zone','bigint','boolean','boolean','text','text','boolean','boolean','text','text[]','text'],
            'physical evidence ingest RPC remains available'
          );

          select ok(
            position('pg_advisory_xact_lock(hashtext(p_receipt_id::text))' in pg_get_functiondef('public.service_record_physical_pilot_evidence_v1(uuid,uuid,bigint,uuid,uuid,text,text,uuid,text,uuid,uuid,uuid,uuid,text,timestamptz,timestamptz,bigint,boolean,boolean,text,text,boolean,boolean,text,text[],text)'::regprocedure))
              < position('m26_lock_device_authority_v1(p_device_id)' in pg_get_functiondef('public.service_record_physical_pilot_evidence_v1(uuid,uuid,bigint,uuid,uuid,text,text,uuid,text,uuid,uuid,uuid,uuid,text,timestamptz,timestamptz,bigint,boolean,boolean,text,text,boolean,boolean,text,text[],text)'::regprocedure)),
            'receipt identity and exact replay precede mutable device authority'
          );
          select ok(
            position('m26_lock_device_authority_v1(p_device_id)' in pg_get_functiondef('public.service_record_physical_pilot_evidence_v1(uuid,uuid,bigint,uuid,uuid,text,text,uuid,text,uuid,uuid,uuid,uuid,text,timestamptz,timestamptz,bigint,boolean,boolean,text,text,boolean,boolean,text,text[],text)'::regprocedure))
              < position('pg_advisory_xact_lock(hashtext(''m26_repository_authority''))' in pg_get_functiondef('public.service_record_physical_pilot_evidence_v1(uuid,uuid,bigint,uuid,uuid,text,text,uuid,text,uuid,uuid,uuid,uuid,text,timestamptz,timestamptz,bigint,boolean,boolean,text,text,boolean,boolean,text,text[],text)'::regprocedure)),
            'new evidence locks device before repository/certification authority'
          );
          select ok(
            position('pg_advisory_xact_lock(hashtext(''m26_repository_authority''))' in pg_get_functiondef('public.service_record_physical_pilot_evidence_v1(uuid,uuid,bigint,uuid,uuid,text,text,uuid,text,uuid,uuid,uuid,uuid,text,timestamptz,timestamptz,bigint,boolean,boolean,text,text,boolean,boolean,text,text[],text)'::regprocedure))
              < position('physical_pilot_repository_authority' in pg_get_functiondef('public.service_record_physical_pilot_evidence_v1(uuid,uuid,bigint,uuid,uuid,text,text,uuid,text,uuid,uuid,uuid,uuid,text,timestamptz,timestamptz,bigint,boolean,boolean,text,text,boolean,boolean,text,text[],text)'::regprocedure)),
            'repository lock precedes repository authority read'
          );
          select ok(
            position('pg_advisory_xact_lock(hashtext(''m26_repository_authority''))' in pg_get_functiondef('public.service_record_physical_pilot_evidence_v1(uuid,uuid,bigint,uuid,uuid,text,text,uuid,text,uuid,uuid,uuid,uuid,text,timestamptz,timestamptz,bigint,boolean,boolean,text,text,boolean,boolean,text,text[],text)'::regprocedure))
              < position('m26_current_certification_run_v1' in pg_get_functiondef('public.service_record_physical_pilot_evidence_v1(uuid,uuid,bigint,uuid,uuid,text,text,uuid,text,uuid,uuid,uuid,uuid,text,timestamptz,timestamptz,bigint,boolean,boolean,text,text,boolean,boolean,text,text[],text)'::regprocedure)),
            'repository lock precedes certification authority read'
          );
          select ok(
            has_function_privilege('service_role','public.service_record_physical_pilot_evidence_v1(uuid,uuid,bigint,uuid,uuid,text,text,uuid,text,uuid,uuid,uuid,uuid,text,timestamptz,timestamptz,bigint,boolean,boolean,text,text,boolean,boolean,text,text[],text)','EXECUTE'),
            'service role retains sanctioned evidence ingest execution'
          );
          select ok(
            not has_function_privilege('authenticated','public.service_record_physical_pilot_evidence_v1(uuid,uuid,bigint,uuid,uuid,text,text,uuid,text,uuid,uuid,uuid,uuid,text,timestamptz,timestamptz,bigint,boolean,boolean,text,text,boolean,boolean,text,text[],text)','EXECUTE'),
            'authenticated role remains excluded from evidence ingest RPC'
          );

          select * from finish();
          rollback;
          SQL

          cat > tests/m26-evidence-repository-lock-closure.test.ts <<'TS'
          import { describe, expect, it } from "vitest";
          import { readFileSync } from "node:fs";

          describe("M26 evidence repository lock closure", () => {
            const migration = readFileSync(
              "supabase/migrations/20260814080000_m26_evidence_repository_lock_closure.sql",
              "utf8",
            );

            it("keeps exact evidence replay before mutable authority", () => {
              const receipt = migration.indexOf("pg_advisory_xact_lock(hashtext(p_receipt_id::text))");
              const replayRead = migration.indexOf("select * into e from public.physical_pilot_evidence_receipts", receipt);
              const replayReturn = migration.indexOf("return e.id", replayRead);
              const device = migration.indexOf("m26_lock_device_authority_v1(p_device_id)", replayReturn);
              expect(receipt).toBeGreaterThan(-1);
              expect(replayRead).toBeGreaterThan(receipt);
              expect(replayReturn).toBeGreaterThan(replayRead);
              expect(device).toBeGreaterThan(replayReturn);
            });

            it("locks device then repository before current authority reads", () => {
              const device = migration.indexOf("m26_lock_device_authority_v1(p_device_id)");
              const repository = migration.indexOf("pg_advisory_xact_lock(hashtext('m26_repository_authority'))", device);
              const commissioning = migration.indexOf("physical_pilot_commissioning where id=p_commissioning_id", repository);
              const repositoryRead = migration.indexOf("physical_pilot_repository_authority", repository);
              const certificationRead = migration.indexOf("m26_current_certification_run_v1", repository);
              expect(device).toBeGreaterThan(-1);
              expect(repository).toBeGreaterThan(device);
              expect(commissioning).toBeGreaterThan(repository);
              expect(repositoryRead).toBeGreaterThan(repository);
              expect(certificationRead).toBeGreaterThan(repository);
            });

            it("retains service-only execution and evidence anti-fake logic", () => {
              expect(migration).toContain("Service authority required");
              expect(migration).toContain("Physical evidence receipt replay conflict");
              expect(migration).toContain("m26_has_authoritative_failure_v1");
              expect(migration).toContain("physical_pilot_evidence_telemetry_receipts");
              expect(migration).toContain("grant execute on function public.service_record_physical_pilot_evidence_v1");
            });
          });
          TS

      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Focused tests
        run: corepack pnpm test -- --run tests/m26-evidence-repository-lock-closure.test.ts tests/m26-network-lock-order-closure.test.ts tests/m26-cert-network-time-closure.test.ts tests/m26-pre-device-readiness.test.ts
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Lint
        run: corepack pnpm lint
      - name: Full Vitest
        run: corepack pnpm test
      - name: Migration guardrails
        run: corepack pnpm migrations:check
      - name: Security guardrails
        run: corepack pnpm security:scan
      - name: Production build
        run: corepack pnpm build

      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - name: Full pgTAP/RLS
        run: supabase test db
      - name: Diff check
        run: git diff --check

      - name: Publish closure and remove temporary workflow
        shell: bash
        run: |
          git config user.name "Kootha Controller"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pr32-evidence-repository-lock-closure.yml
          git add supabase/migrations/20260814080000_m26_evidence_repository_lock_closure.sql \
            supabase/tests/m26_evidence_repository_lock_closure.test.sql \
            tests/m26-evidence-repository-lock-closure.test.ts
          git diff --cached --check
          git commit -m "Serialize M26 evidence with repository authority"
          git push origin HEAD:codex/github-mention-m24/m26-pre-device-integration-readiness-c
