name: PR32 final authority serialization closure

on:
  push:
    branches:
      - codex/github-mention-m24/m26-pre-device-integration-readiness-c
    paths:
      - .github/workflows/pr32-final-authority-serialization.yml

permissions:
  contents: write

jobs:
  close-final-authority-races:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/github-mention-m24/m26-pre-device-integration-readiness-c
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact controller base
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "6730252c2ad71e20f29071d66f0a746da7368252"

      - name: Apply final serialization closure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          migration_path = Path('supabase/migrations/20260814020000_m26_observation_chronology_replay_closure.sql')
          migration = migration_path.read_text(encoding='utf-8')

          old = '''  end if;\n\n  select * into v_candidate from public.m24f_adapter_candidates where id=p_candidate_id;'''
          new = '''  end if;\n\n  -- Exact receipt replay remains independent of mutable authority. Only a real\n  -- commissioning mutation enters the shared per-device M26 serialization law.\n  perform public.m26_lock_device_authority_v1(p_device_id);\n\n  select * into v_candidate from public.m24f_adapter_candidates where id=p_candidate_id;'''
          assert migration.count(old) == 1, f'transition insertion point count: {migration.count(old)}'
          migration = migration.replace(old, new, 1)

          old = ''' perform public.m20a_require_admin();\n perform public.m26_lock_device_authority_v1(p_device_id);\n\n select * into d from public.gps_devices where id=p_device_id;'''
          new = ''' perform public.m20a_require_admin();\n perform public.m26_lock_device_authority_v1(p_device_id);\n -- Repository rotation uses this same lock. Acquiring it before the latest\n -- generation read prevents a committed rotation from being missed by a ready response.\n perform pg_advisory_xact_lock(hashtext('m26_repository_authority'));\n\n select * into d from public.gps_devices where id=p_device_id;'''
          assert migration.count(old) == 1, f'readiness lock insertion point count: {migration.count(old)}'
          migration_path.write_text(migration.replace(old, new, 1), encoding='utf-8')

          pgtap = dedent(r'''
          -- M26 final commissioning/repository serialization guardrails.
          \connect postgres supabase_admin
          begin;
          create extension if not exists pgtap with schema extensions;
          select plan(7);

          select ok(
            pg_get_functiondef('public.admin_transition_physical_pilot_commissioning_v1(uuid,uuid,uuid,bigint,uuid,text,text,text,integer)'::regprocedure)
              ilike '%m26_lock_device_authority_v1(p_device_id)%',
            'commissioning mutations participate in the shared M26 device lock'
          );

          select ok(
            position('m26_lock_device_authority_v1(p_device_id)' in lower(pg_get_functiondef('public.admin_transition_physical_pilot_commissioning_v1(uuid,uuid,uuid,bigint,uuid,text,text,text,integer)'::regprocedure)))
              > position('if v_receipt.id is not null' in lower(pg_get_functiondef('public.admin_transition_physical_pilot_commissioning_v1(uuid,uuid,uuid,bigint,uuid,text,text,text,integer)'::regprocedure)))
            and position('m26_lock_device_authority_v1(p_device_id)' in lower(pg_get_functiondef('public.admin_transition_physical_pilot_commissioning_v1(uuid,uuid,uuid,bigint,uuid,text,text,text,integer)'::regprocedure)))
              < position('select * into v_candidate' in lower(pg_get_functiondef('public.admin_transition_physical_pilot_commissioning_v1(uuid,uuid,uuid,bigint,uuid,text,text,text,integer)'::regprocedure))),
            'exact transition replay is resolved before device serialization and mutation reads'
          );

          select ok(
            pg_get_functiondef('public.admin_get_physical_pilot_readiness_v1(uuid)'::regprocedure)
              ilike '%m26_repository_authority%',
            'readiness takes repository authority serialization'
          );

          select ok(
            position('m26_lock_device_authority_v1(p_device_id)' in lower(pg_get_functiondef('public.admin_get_physical_pilot_readiness_v1(uuid)'::regprocedure)))
              < position('m26_repository_authority' in lower(pg_get_functiondef('public.admin_get_physical_pilot_readiness_v1(uuid)'::regprocedure)))
            and position('m26_repository_authority' in lower(pg_get_functiondef('public.admin_get_physical_pilot_readiness_v1(uuid)'::regprocedure)))
              < position('select * into r' in lower(pg_get_functiondef('public.admin_get_physical_pilot_readiness_v1(uuid)'::regprocedure))),
            'readiness lock order is device then repository before the latest generation read'
          );

          select ok(
            pg_get_functiondef('public.service_rotate_physical_pilot_repository_authority_v1(text,text)'::regprocedure)
              ilike '%m26_repository_authority%',
            'repository rotation and readiness share the same repository serialization key'
          );

          select volatility_is(
            'public','admin_get_physical_pilot_readiness_v1',array['uuid'],'v',
            'readiness remains volatile so post-lock reads use current committed authority'
          );

          select ok(
            not exists(
              select 1 from unnest(array['INSERT','UPDATE','DELETE','TRUNCATE']) privilege_name
              where has_table_privilege('authenticated','public.physical_pilot_commissioning',privilege_name)
            ),
            'serialization closure does not widen browser commissioning table authority'
          );

          select * from finish();
          rollback;
          ''').lstrip()
          Path('supabase/tests/m26_final_authority_serialization.test.sql').write_text(pgtap, encoding='utf-8')

          vitest = dedent(r'''
          import { readFileSync } from "node:fs";
          import { describe, expect, it } from "vitest";

          const closure = readFileSync(
            "supabase/migrations/20260814020000_m26_observation_chronology_replay_closure.sql",
            "utf8",
          );
          const foundation = readFileSync(
            "supabase/migrations/20260811010000_m26_pre_device_commissioning_readiness.sql",
            "utf8",
          );

          describe("M26 final authority serialization", () => {
            it("serializes real commissioning mutations after exact replay handling", () => {
              const transition = closure.slice(
                closure.indexOf("admin_transition_physical_pilot_commissioning_v1"),
                closure.indexOf("admin_get_physical_pilot_readiness_v1"),
              );
              const replay = transition.indexOf("if v_receipt.id is not null");
              const deviceLock = transition.indexOf("m26_lock_device_authority_v1(p_device_id)");
              const mutableRead = transition.indexOf("select * into v_candidate");
              expect(replay).toBeGreaterThan(-1);
              expect(deviceLock).toBeGreaterThan(replay);
              expect(mutableRead).toBeGreaterThan(deviceLock);
            });

            it("serializes repository rotation with readiness before repository state is read", () => {
              const readiness = closure.slice(closure.indexOf("admin_get_physical_pilot_readiness_v1"));
              const deviceLock = readiness.indexOf("m26_lock_device_authority_v1(p_device_id)");
              const repoLock = readiness.indexOf("pg_advisory_xact_lock(hashtext('m26_repository_authority'))");
              const repoRead = readiness.indexOf("select * into r");
              expect(deviceLock).toBeGreaterThan(-1);
              expect(repoLock).toBeGreaterThan(deviceLock);
              expect(repoRead).toBeGreaterThan(repoLock);
              expect(foundation).toContain("pg_advisory_xact_lock(hashtext('m26_repository_authority'))");
            });
          });
          ''').lstrip()
          Path('tests/m26-final-authority-serialization.test.ts').write_text(vitest, encoding='utf-8')
          PY

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Focused application verification
        run: corepack pnpm test -- --run tests/m26-final-authority-serialization.test.ts tests/m26-controller-concurrency-ui.test.ts tests/m26-pre-device-readiness.test.ts

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Lint
        run: corepack pnpm lint

      - name: Full Vitest
        run: corepack pnpm test

      - name: Migration guardrails
        run: corepack pnpm migrations:check

      - name: Security guardrails
        run: corepack pnpm security:scan

      - name: Production build
        run: corepack pnpm build

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start disposable Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor

      - name: Full pgTAP/RLS verification
        run: supabase test db

      - name: Diff check
        run: git diff --check

      - name: Commit closure and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Kootha Controller"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pr32-final-authority-serialization.yml
          git add supabase/migrations/20260814020000_m26_observation_chronology_replay_closure.sql \
            supabase/tests/m26_final_authority_serialization.test.sql \
            tests/m26-final-authority-serialization.test.ts
          git commit -m "Serialize M26 commissioning and repository readiness authority"
          git push origin HEAD:codex/github-mention-m24/m26-pre-device-integration-readiness-c
