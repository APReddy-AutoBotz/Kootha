name: PR32 lifecycle and UUID closure

on:
  push:
    branches:
      - codex/github-mention-m24/m26-pre-device-integration-readiness-c
    paths:
      - .github/workflows/pr32-lifecycle-uuid-closure.yml

permissions:
  contents: write

jobs:
  close-review-findings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/github-mention-m24/m26-pre-device-integration-readiness-c
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact base
        shell: bash
        run: test "$(git rev-parse HEAD^)" = "65153f074c27a8f936555cc170ce14de0e8062ad"

      - name: Apply lifecycle serialization and UUID parity closure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          shared_path = Path('packages/shared/src/physicalTelemetry/m26Readiness.ts')
          shared = shared_path.read_text(encoding='utf-8')
          old = 'const sha256 = /^[a-f0-9]{64}$/;\n'
          new = 'const sha256 = /^[a-f0-9]{64}$/;\nconst uuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/iu;\n'
          assert shared.count(old) == 1
          shared = shared.replace(old, new, 1)

          old = '''  if (!v.adapter || !bounded(v.adapter.manifestId) || !bounded(v.adapter.adapterId)\n    || !bounded(v.adapter.adapterVersion) || !isSafeMetadataV1(v.adapter.adapterId)'''
          new = '''  if (!v.adapter || !uuid.test(v.adapter.manifestId) || !bounded(v.adapter.adapterId)\n    || !bounded(v.adapter.adapterVersion) || !isSafeMetadataV1(v.adapter.adapterId)'''
          assert shared.count(old) == 1
          shared = shared.replace(old, new, 1)

          old = '''  if (!v.device || !sha256.test(v.device.identityHash) || !bounded(v.device.installationReceiptId)\n    || !bounded(v.device.vehicleLinkReceiptId)) {'''
          new = '''  if (!v.device || !sha256.test(v.device.identityHash) || !uuid.test(v.device.installationReceiptId)\n    || !uuid.test(v.device.vehicleLinkReceiptId)) {'''
          assert shared.count(old) == 1
          shared = shared.replace(old, new, 1)

          old = '''  if (!v.network || !bounded(v.network.configurationClass, 80)\n    || !isSafeMetadataV1(v.network.configurationClass) || !bounded(v.network.validationReceiptId)) {'''
          new = '''  if (!v.network || !bounded(v.network.configurationClass, 80)\n    || !isSafeMetadataV1(v.network.configurationClass) || !uuid.test(v.network.validationReceiptId)) {'''
          assert shared.count(old) == 1
          shared = shared.replace(old, new, 1)

          old = '''    || v.reasonCodes.some((reason) => !bounded(reason, 80) || !isSafeMetadataV1(reason))\n    || !sha256.test(v.operatorIdHash ?? "") || !bounded(v.receiptId) || !timestamp(v.recordedAt)) {'''
          new = '''    || v.reasonCodes.some((reason) => !bounded(reason, 80) || !isSafeMetadataV1(reason))\n    || !sha256.test(v.operatorIdHash ?? "") || !uuid.test(v.receiptId ?? "") || !timestamp(v.recordedAt)) {'''
          assert shared.count(old) == 1
          shared_path.write_text(shared.replace(old, new, 1), encoding='utf-8')

          replacements = {
            'manifest-1': '11111111-1111-4111-8111-111111111111',
            'install-1': '22222222-2222-4222-8222-222222222222',
            'link-1': '33333333-3333-4333-8333-333333333333',
            'network-1': '44444444-4444-4444-8444-444444444444',
            'receipt-1': '55555555-5555-4555-8555-555555555555',
          }
          for test_name in ['tests/m26-pre-device-readiness.test.ts', 'tests/m26-future-observation-boundary.test.ts']:
            path = Path(test_name)
            text = path.read_text(encoding='utf-8')
            for before, after in replacements.items():
              text = text.replace(before, after)
            path.write_text(text, encoding='utf-8')

          migration = dedent(r'''
          -- M26 lifecycle authority serialization closure.
          -- M20A/M21/M22 writers may reach these tables through several sanctioned
          -- paths.  Row-level fail-fast advisory locking makes every write participate
          -- in the same per-device authority law as M26 readiness/evidence without a
          -- blocking row-trigger cycle: if readiness/evidence already owns the lock,
          -- the lifecycle mutation aborts with a retryable serialization failure.

          create or replace function public.m26_try_device_authority_lock_v1(p_device_id uuid)
          returns void
          language plpgsql
          set search_path = pg_catalog, public
          as $$
          begin
            if p_device_id is null then
              raise exception 'M26 device authority requires device id' using errcode='22023';
            end if;
            if not pg_try_advisory_xact_lock(hashtextextended(p_device_id::text, 0)) then
              raise exception 'M26 device authority busy; retry transaction' using errcode='40001';
            end if;
          end
          $$;
          revoke all on function public.m26_try_device_authority_lock_v1(uuid)
            from public, anon, authenticated, service_role;

          create or replace function public.m26_serialize_gps_device_authority_write_v1()
          returns trigger
          language plpgsql
          set search_path = pg_catalog, public
          as $$
          declare v_old uuid; v_new uuid;
          begin
            if tg_op <> 'INSERT' then v_old := old.id; end if;
            if tg_op <> 'DELETE' then v_new := new.id; end if;
            if v_old is not null then perform public.m26_try_device_authority_lock_v1(v_old); end if;
            if v_new is not null and v_new is distinct from v_old then perform public.m26_try_device_authority_lock_v1(v_new); end if;
            if tg_op='DELETE' then return old; else return new; end if;
          end
          $$;
          revoke all on function public.m26_serialize_gps_device_authority_write_v1()
            from public, anon, authenticated, service_role;

          create or replace function public.m26_serialize_gps_device_child_authority_write_v1()
          returns trigger
          language plpgsql
          set search_path = pg_catalog, public
          as $$
          declare v_old uuid; v_new uuid;
          begin
            if tg_op <> 'INSERT' then v_old := old.gps_device_id; end if;
            if tg_op <> 'DELETE' then v_new := new.gps_device_id; end if;
            if v_old is not null then perform public.m26_try_device_authority_lock_v1(v_old); end if;
            if v_new is not null and v_new is distinct from v_old then perform public.m26_try_device_authority_lock_v1(v_new); end if;
            if tg_op='DELETE' then return old; else return new; end if;
          end
          $$;
          revoke all on function public.m26_serialize_gps_device_child_authority_write_v1()
            from public, anon, authenticated, service_role;

          drop trigger if exists gps_devices_m26_authority_serialize on public.gps_devices;
          create trigger gps_devices_m26_authority_serialize
          before insert or update or delete on public.gps_devices
          for each row execute function public.m26_serialize_gps_device_authority_write_v1();

          drop trigger if exists gps_device_vehicle_links_m26_authority_serialize on public.gps_device_vehicle_links;
          create trigger gps_device_vehicle_links_m26_authority_serialize
          before insert or update or delete on public.gps_device_vehicle_links
          for each row execute function public.m26_serialize_gps_device_child_authority_write_v1();

          drop trigger if exists gps_device_lifecycle_events_m26_authority_serialize on public.gps_device_lifecycle_events;
          create trigger gps_device_lifecycle_events_m26_authority_serialize
          before insert or update or delete on public.gps_device_lifecycle_events
          for each row execute function public.m26_serialize_gps_device_child_authority_write_v1();

          drop trigger if exists gps_device_credential_metadata_m26_authority_serialize on public.gps_device_credential_metadata;
          create trigger gps_device_credential_metadata_m26_authority_serialize
          before insert or update or delete on public.gps_device_credential_metadata
          for each row execute function public.m26_serialize_gps_device_child_authority_write_v1();
          ''').lstrip()
          Path('supabase/migrations/20260814050000_m26_lifecycle_authority_serialization.sql').write_text(migration, encoding='utf-8')

          pgtap = dedent(r'''
          -- M26 lifecycle writer serialization guardrails.
          \connect postgres supabase_admin
          begin;
          create extension if not exists pgtap with schema extensions;
          select plan(12);

          select ok(pg_get_functiondef('public.m26_try_device_authority_lock_v1(uuid)'::regprocedure) ilike '%pg_try_advisory_xact_lock(hashtextextended(p_device_id::text, 0))%','lifecycle writers use the exact M26 per-device advisory key');
          select ok(pg_get_functiondef('public.m26_try_device_authority_lock_v1(uuid)'::regprocedure) ilike '%40001%','contended lifecycle mutations fail with retryable serialization error');
          select ok(pg_get_functiondef('public.m26_serialize_gps_device_authority_write_v1()'::regprocedure) ilike '%m26_try_device_authority_lock_v1%','device table writes enter M26 authority');
          select ok(pg_get_functiondef('public.m26_serialize_gps_device_child_authority_write_v1()'::regprocedure) ilike '%m26_try_device_authority_lock_v1%','child authority table writes enter M26 authority');

          select has_trigger('public','gps_devices','gps_devices_m26_authority_serialize','device status/readiness writes serialize with M26 readiness');
          select has_trigger('public','gps_device_vehicle_links','gps_device_vehicle_links_m26_authority_serialize','vehicle-link writes serialize with M26 readiness');
          select has_trigger('public','gps_device_lifecycle_events','gps_device_lifecycle_events_m26_authority_serialize','lifecycle writes serialize with M26 readiness');
          select has_trigger('public','gps_device_credential_metadata','gps_device_credential_metadata_m26_authority_serialize','credential writes serialize with M26 readiness');

          select ok(pg_get_triggerdef((select oid from pg_trigger where tgname='gps_devices_m26_authority_serialize' and not tgisinternal)) ilike '%BEFORE INSERT OR DELETE OR UPDATE%','device trigger covers all mutation verbs');
          select ok(pg_get_triggerdef((select oid from pg_trigger where tgname='gps_device_vehicle_links_m26_authority_serialize' and not tgisinternal)) ilike '%BEFORE INSERT OR DELETE OR UPDATE%','link trigger covers all mutation verbs');
          select ok(pg_get_triggerdef((select oid from pg_trigger where tgname='gps_device_lifecycle_events_m26_authority_serialize' and not tgisinternal)) ilike '%BEFORE INSERT OR DELETE OR UPDATE%','lifecycle trigger covers all mutation verbs');
          select ok(pg_get_triggerdef((select oid from pg_trigger where tgname='gps_device_credential_metadata_m26_authority_serialize' and not tgisinternal)) ilike '%BEFORE INSERT OR DELETE OR UPDATE%','credential trigger covers all mutation verbs');

          select * from finish();
          rollback;
          ''').lstrip()
          Path('supabase/tests/m26_lifecycle_authority_serialization.test.sql').write_text(pgtap, encoding='utf-8')

          regression = dedent(r'''
          import { readFileSync } from "node:fs";
          import { describe, expect, it } from "vitest";
          import { M26_READINESS_CONTRACT_VERSION_V1, validatePhysicalEvidenceManifestV1 } from "@kootha/shared";

          const capabilities = { sequenceSupported: true, reconnectSupported: false } as const;
          const valid = {
            contractVersion: M26_READINESS_CONTRACT_VERSION_V1,
            classification: "physical" as const,
            physicalEvidence: true,
            repository: { headSha: "a".repeat(40), workflowRunId: "run-31" },
            adapter: { manifestId: "11111111-1111-4111-8111-111111111111", adapterId: "selected-adapter", adapterVersion: "1.0.0" },
            device: { identityHash: "b".repeat(64), installationReceiptId: "22222222-2222-4222-8222-222222222222", vehicleLinkReceiptId: "33333333-3333-4333-8333-333333333333" },
            network: { configurationClass: "approved-class", validationReceiptId: "44444444-4444-4444-8444-444444444444" },
            observation: { startedAt: "2026-08-11T10:00:00Z", endedAt: "2026-08-11T10:30:00Z", telemetryCount: 1 },
            outcomes: { authentication: "passed" as const, replay: "passed" as const, sequence: "passed" as const, reconnect: "not_supported" as const, freshness: "passed" as const, health: "passed" as const },
            disposition: "pass" as const,
            reasonCodes: [],
            operatorIdHash: "c".repeat(64),
            receiptId: "55555555-5555-4555-8555-555555555555",
            recordedAt: "2026-08-11T10:31:00Z",
          };

          describe("M26 UUID selector parity", () => {
            it("accepts canonical UUID selectors and rejects non-UUID evidence selectors before RPC invocation", () => {
              expect(validatePhysicalEvidenceManifestV1(valid, capabilities).ok).toBe(true);
              expect(validatePhysicalEvidenceManifestV1({ ...valid, adapter: { ...valid.adapter, manifestId: "x" } }, capabilities).ok).toBe(false);
              expect(validatePhysicalEvidenceManifestV1({ ...valid, device: { ...valid.device, installationReceiptId: "x" } }, capabilities).ok).toBe(false);
              expect(validatePhysicalEvidenceManifestV1({ ...valid, device: { ...valid.device, vehicleLinkReceiptId: "x" } }, capabilities).ok).toBe(false);
              expect(validatePhysicalEvidenceManifestV1({ ...valid, network: { ...valid.network, validationReceiptId: "x" } }, capabilities).ok).toBe(false);
              expect(validatePhysicalEvidenceManifestV1({ ...valid, receiptId: "x" }, capabilities).ok).toBe(false);
            });
          });

          describe("M26 lifecycle authority serialization", () => {
            const migration = readFileSync('supabase/migrations/20260814050000_m26_lifecycle_authority_serialization.sql', 'utf8');
            it("serializes all four current lifecycle authority tables with a fail-fast shared device lock", () => {
              expect(migration).toContain('pg_try_advisory_xact_lock(hashtextextended(p_device_id::text, 0))');
              expect(migration).toContain("errcode='40001'");
              for (const trigger of [
                'gps_devices_m26_authority_serialize',
                'gps_device_vehicle_links_m26_authority_serialize',
                'gps_device_lifecycle_events_m26_authority_serialize',
                'gps_device_credential_metadata_m26_authority_serialize',
              ]) expect(migration).toContain(trigger);
            });
          });
          ''').lstrip()
          Path('tests/m26-lifecycle-uuid-closure.test.ts').write_text(regression, encoding='utf-8')
          PY

      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Focused tests
        run: corepack pnpm test -- --run tests/m26-lifecycle-uuid-closure.test.ts tests/m26-pre-device-readiness.test.ts tests/m26-future-observation-boundary.test.ts
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Lint
        run: corepack pnpm lint
      - name: Full Vitest
        run: corepack pnpm test
      - name: Migration guardrails
        run: corepack pnpm migrations:check
      - name: Security guardrails
        run: corepack pnpm security:scan
      - name: Production build
        run: corepack pnpm build
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start disposable Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - name: Full pgTAP/RLS
        run: supabase test db
      - name: Diff check
        run: git diff --check
      - name: Publish closure and remove workflow
        shell: bash
        run: |
          git config user.name "Kootha Controller"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/pr32-lifecycle-uuid-closure.yml
          git add packages/shared/src/physicalTelemetry/m26Readiness.ts \
            tests/m26-pre-device-readiness.test.ts \
            tests/m26-future-observation-boundary.test.ts \
            supabase/migrations/20260814050000_m26_lifecycle_authority_serialization.sql \
            supabase/tests/m26_lifecycle_authority_serialization.test.sql \
            tests/m26-lifecycle-uuid-closure.test.ts
          git commit -m "Serialize M26 lifecycle authority and validate UUID selectors"
          git push origin HEAD:codex/github-mention-m24/m26-pre-device-integration-readiness-c
