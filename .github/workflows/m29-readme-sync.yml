# M29 branch-scoped one-shot documentation controller.
name: M29 README sync

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-readme:
    if: github.event.pull_request.head.ref == 'milestone/m29-hosted-release-control' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone/m29-hosted-release-control
          fetch-depth: 0
      - name: Update README and remove controller workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')

          first_old = 'M28 Commercial & Schedule Operations Control is completed; the original selected-device M24 and real physical M26 remain AP/hardware/evidence-gated.'
          first_new = 'M28 Commercial & Schedule Operations Control is completed; M29 Hosted Release Activation & Recovery Control is completed in software on this branch; the original selected-device M24 and real physical M26 remain AP/hardware/evidence-gated.'
          if first_old not in text and first_new not in text:
              raise SystemExit('README top milestone marker not found')
          text = text.replace(first_old, first_new, 1)

          scope_old = 'M28 commercial/schedule control is completed; original M24 physical selection and real M26 physical execution remain incomplete pending AP selection and real evidence.'
          scope_new = 'M28 commercial/schedule control is completed; M29 hosted release activation/recovery software is completed on this branch; original M24 physical selection and real M26 physical execution remain incomplete pending AP selection and real evidence.'
          if scope_old not in text and scope_new not in text:
              raise SystemExit('README current-scope marker not found')
          text = text.replace(scope_old, scope_new, 1)

          heading = '## M29 Hosted Release Readiness\n'
          if heading not in text:
              marker = '## Environment\n'
              if marker not in text:
                  raise SystemExit('README Environment marker not found')
              section = '''## M29 Hosted Release Readiness

M29 adds deterministic, secret-free hosted release controls without changing product runtime or database authority. Run repository policy/provenance checks with:

    pnpm check:release-readiness -- --mode preview --config-source repository --output output/m29-preview-release-manifest.json
    pnpm check:release-readiness -- --mode production --config-source repository --output output/m29-production-release-manifest.json

Use [the M29 hosted activation and rollback runbook](docs/production/m29-hosted-release-activation.md) before any capacity-approved hosted promotion. Repository checks deliberately report live Supabase, Netlify preview and rollback evidence as `blocked-not-run` until those checks actually execute. The existing Kootha Supabase project remains inactive because of the organization free-project quota; do not pause or delete unrelated projects to bypass that capacity gate. Public enquiry intake and retention deletion remain fail-closed until separately approved.

'''
              text = text.replace(marker, section + marker, 1)

          readme.write_text(text, encoding='utf-8')
          Path('.github/workflows/m29-readme-sync.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/m29-readme-sync.yml
          git diff --cached --check
          git commit -m "M29: document hosted release readiness"
          git push origin HEAD:milestone/m29-hosted-release-control
