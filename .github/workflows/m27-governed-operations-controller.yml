name: M27 governed operations controller

on:
  push:
    branches:
      - milestone/m27-governed-operations-export-audit

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact controller head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact merged base
        shell: bash
        run: |
          set -euo pipefail
          expected="9062a01bb8f6704bba0e0cd2a626312dfbbd558b"
          actual="$(git rev-parse HEAD^)"
          test "$actual" = "$expected" || {
            echo "Expected controller parent $expected but found $actual"
            exit 1
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generate migration and wire M27
        shell: bash
        run: |
          set -euo pipefail
          supabase migration new m27_governed_operations_export >/tmp/m27-migration.txt
          migration="$(ls -1 supabase/migrations/*_m27_governed_operations_export.sql | tail -1)"
          test -n "$migration"
          cp scripts/m27-governed-operations-export.sql.template "$migration"
          rm scripts/m27-governed-operations-export.sql.template
          python scripts/m27-wire.py
          rm scripts/m27-wire.py
          git diff --check

      - name: Run focused M27 tests
        run: pnpm test -- --run tests/m27-operations-export.test.ts tests/m27-operations-ui.test.ts

      - name: Run full Vitest
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Migration guardrails
        run: pnpm migrations:check

      - name: Security guardrails
        run: pnpm security:scan

      - name: Production build
        run: pnpm build

      - name: Start fresh Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor

      - name: Run full pgTAP and RLS suite
        run: supabase test db

      - name: Final diff proof
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f packages/shared/src/operationsExport.ts
          test -f apps/web/src/admin-operations.tsx
          test -f supabase/tests/m27_operations_export.test.sql
          test "$(ls -1 supabase/migrations/*_m27_governed_operations_export.sql | wc -l)" -eq 1
          test ! -e scripts/m27-wire.py
          test ! -e scripts/m27-governed-operations-export.sql.template

      - name: Publish verified M27 product commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m27-governed-operations-controller.yml
          git config user.name "APReddy-AutoBotz"
          git config user.email "avalaparameswarareddy@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add M27 governed operations export workbench"
          git push origin HEAD:milestone/m27-governed-operations-export-audit
