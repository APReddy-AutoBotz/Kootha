name: M27 status closure

on:
  push:
    branches:
      - milestone/m27-governed-operations-export-audit

permissions:
  contents: write

jobs:
  publish-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact controller head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact verified parent
        shell: bash
        run: |
          set -euo pipefail
          expected="c6690a8fda7cda1332b07de86be52ea9ac572fb4"
          actual="$(git rev-parse HEAD^)"
          test "$actual" = "$expected" || {
            echo "Expected status-controller parent $expected but found $actual"
            exit 1
          }

      - name: Apply status closure
        shell: bash
        run: |
          set -euo pipefail
          python scripts/m27-status-closure.py
          rm scripts/m27-status-closure.py
          git diff --check
          grep -q 'M27 Governed Operations Export & Audit Workbench are completed' README.md
          grep -A2 'Milestone M27 - Governed Operations Export & Audit Workbench' .kiro/specs/kootha-prachar-mvp/tasks.md | grep -q '\[x\] Completed'
          grep -q 'Software implementation complete and exact-head verified' docs/operations/m27-governed-export-audit.md

      - name: Publish status-only closure
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/m27-status-closure.yml
          git config user.name "APReddy-AutoBotz"
          git config user.email "avalaparameswarareddy@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: mark M27 software scope complete"
          git push origin HEAD:milestone/m27-governed-operations-export-audit
